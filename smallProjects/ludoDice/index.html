 <div class="container">

      <script>

      ludoGame = () => {

       const min = 1;
        const max = 6;
        const playerOne = Math.floor(Math.random() * (max - min + 1) + min)
        const playerOneDice = `images/dice${playerOne}.png`;
        document.getElementById("check1").setAttribute("src", playerOneDice);

        const playerTwo = Math.floor(Math.random() * (max - min + 1) + min)
        const playerTwoDice = `images/dice${playerTwo}.png`;
        document.getElementById("check2").setAttribute("src", playerTwoDice);

        if (playerOne > playerTwo) {
          document.querySelector('h1').innerHTML = "Player One Won"
        } else if (playerTwo > playerOne) {
          document.querySelector('h1').innerHTML = "Player Two Won"

        } else {
          document.querySelector('h1').innerHTML = "DRAW"

        }

      }

      </script>
